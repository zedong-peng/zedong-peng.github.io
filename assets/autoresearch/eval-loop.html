<figure aria-labelledby="title">
<div class="eyebrow">Figure 2 · Reading Anthropic's design</div>
<h1 id="title">Build the measurement into the loop</h1>
<p>Human judgment establishes the eval. The agent searches within it.</p>
<div class="stages">
<section class="stage"><span class="number">01</span><h2>Calibrate</h2><div class="command">/claude-api build-eval</div><ul class="items"><li>Representative cases</li><li>Review sample grades</li><li>Measure baseline noise</li></ul><div class="gate">Human approves cases + grader</div></section>
<section class="stage"><span class="number">02</span><h2>Change</h2><div class="command">/claude-api hillclimb</div><ul class="items"><li>Read training failures</li><li>Propose one hypothesis</li><li>Apply a reversible patch</li></ul><div class="gate">Scope + budget + objective</div></section>
<section class="stage"><span class="number">03</span><h2>Measure</h2><div class="command">evaluate → keep / revert</div><ul class="items"><li>Run train + held-out eval</li><li>Check gain against noise</li><li>Save traces and decisions</li></ul><div class="gate">Evidence feeds the next round ↶</div></section>
</div>
<div class="diagnosis"><strong>When it stalls<br>↳ Diagnose</strong><p>Missing content? Wrong grader? Broken harness? Instructions the model never reaches? Ordinary variance? Each calls for a different next step.</p></div>
<div class="split"><span class="label">OPTIONAL THREE-WAY SPLIT · FOR A FINAL NUMBER UNUSED IN ROUND SELECTION</span><b>Train · propose</b><span>→</span><b>Validation · select</b><span>→</span><b class="final">Test · once at the end</b></div>
<p class="note">The default workflow scores a held-out “test” slice every round. The public guide also offers the three-way split shown here. My schematic; <a href="https://github.com/anthropics/skills/blob/ca45fc496a3436251f191354091d557da31c15b5/skills/claude-api/shared/evals/eval-hillclimb.md" target="_blank" rel="noopener">source version read November 6 ↗</a>.</p>
</figure>
