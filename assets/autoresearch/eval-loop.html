<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anthropic's eval and hillclimbing loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/site.css">
<!-- The look comes from site.css; this block only lays the figure out. -->
<style>
:root{--ink:var(--fg);--soft:var(--muted);--rule:var(--line);--clay:#c6613f;--sage:#788c5d}
body{margin:0;font:14px/1.55 var(--sans);color:var(--ink)}figure{margin:0;padding:0}
h1{font:600 14px/1.55 var(--sans);letter-spacing:0;margin:0}
p{font-size:14px;line-height:1.55;margin:0;color:var(--soft)}
.stages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin:20px 0 20px}
.stage{position:relative;border-top:1px solid var(--ink);padding-top:12px}
.stage:not(:last-child)::after{content:'→';position:absolute;right:-21px;top:12px;color:var(--soft)}
.number{font:13px var(--mono);color:var(--clay)}
h2{font:600 17px/1.4 var(--sans);margin:2px 0 4px}
.command{font:13px var(--mono);color:var(--soft);overflow-wrap:anywhere;margin-bottom:10px}
.items{padding:0;margin:0;list-style:none}.items li{margin:4px 0}
.gate{color:var(--soft);border-top:1px solid var(--rule);padding-top:8px;margin-top:10px}
.diagnosis{display:flex;gap:20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0}
.diagnosis strong{flex:0 0 120px;font-weight:600}
.split{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split .label{color:var(--soft);width:100%}.split .then{white-space:nowrap;color:var(--soft)}.split .then b{color:var(--ink);margin-left:6px}
.split b{display:inline-block;font-weight:400;padding:4px 12px;background:var(--wash);border-radius:999px}
.split .final{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
@media(max-width:580px){.stages{grid-template-columns:1fr;gap:16px}.stage:not(:last-child)::after{display:none}.diagnosis{display:block}.diagnosis strong{display:block;margin-bottom:4px}.diagnosis br{display:none}}
</style>
</head>
<body>
<figure aria-labelledby="title">
<h1 id="title">A person sets up the eval; the agent searches within it</h1>
<div class="stages">
<section class="stage"><span class="number">01</span><h2>Calibrate</h2><div class="command">/claude-api build-eval</div><ul class="items"><li>Representative cases</li><li>Review sample grades</li><li>Measure baseline noise</li></ul><div class="gate">Human approves cases + grader</div></section>
<section class="stage"><span class="number">02</span><h2>Change</h2><div class="command">/claude-api hillclimb</div><ul class="items"><li>Read training failures</li><li>Propose one hypothesis</li><li>Apply a reversible patch</li></ul><div class="gate">Scope + budget + objective</div></section>
<section class="stage"><span class="number">03</span><h2>Measure</h2><div class="command">evaluate → keep / revert</div><ul class="items"><li>Run train + held-out eval</li><li>Check gain against noise</li><li>Save traces and decisions</li></ul><div class="gate">Evidence feeds the next round ↶</div></section>
</div>
<div class="diagnosis"><strong>When it stalls</strong><p>Missing content? Wrong grader? Broken harness? Instructions the model never reaches? Ordinary variance? Each calls for a different next step.</p></div>
<div class="split"><span class="label">Optional three-way split, for a final number that no round was selected on</span><b>Train · propose</b><span class="then">→ <b>Validation · select</b></span><span class="then">→ <b class="final">Test · once at the end</b></span></div>
</figure>
</body>
</html>
