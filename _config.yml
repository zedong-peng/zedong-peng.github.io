# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # "blank" makes the page title the name below
first_name: Zedong
last_name: Peng
description: The personal website of Zedong Peng.
keywords: Zedong Peng, machine learning, AI
lang: en
timezone: Asia/Shanghai

url: https://zedongpeng.com
baseurl: # empty: the site is served from the domain root

# Open Graph and Twitter card tags in the head (_includes/metadata.liquid)
serve_og_meta: true
og_image: https://zedongpeng.com/assets/img/profile.bighead.png # the site-wide preview image

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Posts
permalink: /blog/:year/:title/
display_categories: ["research", "life"] # the sections of the blog index and of the Posts menu

# Giscus comments, see https://giscus.app/
giscus:
  repo: zedong-peng/zedong-peng.github.io
  repo_id: R_kgDOQC8-BA
  category: Announcements # only maintainers and giscus can open a discussion here
  category_id: DIC_kwDOQC8-BM4DLBci
  mapping: pathname # one discussion per post URL, so a retitled post keeps its comments
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  light_theme: light
  emit_metadata: 0
  lang: en

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - AGENTS.md
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-terser
  - jekyll-toc

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      giscus_comments: true

jekyll-minifier:
  compress_javascript: false # terser minifies the JavaScript
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

# Category pages (/blog/category/research/) and year pages (/blog/2026/), in _layouts/archive.liquid
jekyll-archives:
  posts:
    enabled: [year, categories]
    permalinks:
      year: "/blog/:year/"
      categories: "/blog/:type/:name/"

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar), rendered on the CV by _layouts/cv_publication.liquid
# -----------------------------------------------------------------------------

scholar:
  last_name: [Peng]
  first_name: [Zedong]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: cv_publication
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  query: "@*"
  group_by: year
  group_order: descending

# -----------------------------------------------------------------------------
# Links and images
# -----------------------------------------------------------------------------

# jekyll-link-attributes: external links open in a new tab
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# jekyll-imagemagick: responsive WebP copies of the images, used by _includes/figure.liquid
imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-quality 85"

lazy_loading_images: true # figure.liquid adds loading="lazy"

# -----------------------------------------------------------------------------
# Third-party libraries
# -----------------------------------------------------------------------------

# Loaded by _includes/scripts.liquid on pages that contain math. The integrity hash pins the file.
mathjax:
  url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
  integrity: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
