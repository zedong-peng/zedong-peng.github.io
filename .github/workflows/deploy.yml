name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy.yml"
      - "!.github/workflows/update-tocs.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy.yml"
      - "!.github/workflows/update-tocs.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Build the tokendust board 🧾
        # The tool is its own repo; build it here so scan.py and the board cannot
        # drift from the source. A failed fetch fails the deploy on purpose.
        env:
          REPO: zedong-peng/tokendust
          REF: main
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$REF/scan.py" -o assets/tokendust/scan.py
          mkdir -p .tokendust-build
          for file in page.html prices.json build.py vendor/qrcode.js; do
            mkdir -p ".tokendust-build/$(dirname $file)"
            curl -fsSL "https://raw.githubusercontent.com/$REPO/$REF/$file" -o ".tokendust-build/$file"
          done
          python3 .tokendust-build/build.py
          python3 - <<'EOF'
          # Keep the Jekyll front matter from the committed page, swap the body.
          page = open("_pages/tokendust.html", encoding="utf-8").read()
          front = page.split("---\n", 2)[1]
          built = open(".tokendust-build/index.html", encoding="utf-8").read()
          open("_pages/tokendust.html", "w", encoding="utf-8").write("---\n" + front + "---\n" + built)
          import ast
          ast.parse(open("assets/tokendust/scan.py", encoding="utf-8").read())
          assert "tokendust" in built and "qrcode" in built
          EOF
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Print CV to PDF 🖨️
        run: |
          python3 -m http.server 4000 --directory _site >/dev/null 2>&1 &
          server=$!
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=15000 \
            --print-to-pdf=_site/assets/pdf/Zedong_Peng_CV.pdf http://localhost:4000/cv/
          kill $server
          test -s _site/assets/pdf/Zedong_Peng_CV.pdf
      - name: Check internal links 🔗
        # report only: a broken link should not block publishing
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: false
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --no-progress '_site/**/*.html'
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
