name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy.yml"
      - "!.github/workflows/update-tocs.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy.yml"
      - "!.github/workflows/update-tocs.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Build the tokendust board 🧾
        # The tool is its own repo; build it here so scan.py and the board cannot
        # drift from the source. A failed fetch fails the deploy on purpose.
        env:
          REPO: zedong-peng/tokendust
          REF: main
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$REF/scan.py" -o assets/tokendust/scan.py
          mkdir -p .tokendust-build
          for file in page.html prices.json build.py vendor/qrcode.js; do
            mkdir -p ".tokendust-build/$(dirname $file)"
            curl -fsSL "https://raw.githubusercontent.com/$REPO/$REF/$file" -o ".tokendust-build/$file"
          done
          python3 .tokendust-build/build.py
          python3 - <<'EOF'
          # Keep the Jekyll front matter from the committed page, swap the body.
          page = open("_pages/tokendust.html", encoding="utf-8").read()
          front = page.split("---\n", 2)[1]
          built = open(".tokendust-build/index.html", encoding="utf-8").read()
          open("_pages/tokendust.html", "w", encoding="utf-8").write("---\n" + front + "---\n" + built)
          import ast
          ast.parse(open("assets/tokendust/scan.py", encoding="utf-8").read())
          assert "tokendust" in built and "qrcode" in built
          EOF
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Build the Qwen3.8-4090 leaderboard 📈
        # The leaderboard is built as a standalone static site from its own repo.
        # It is not a Jekyll page: the blog only serves the output.
        env:
          REPO: zedong-peng/qwen38-4090-inference
          REF: main
        run: |
          mkdir -p .qwen38-build
          curl -fsSL "https://github.com/$REPO/archive/refs/heads/$REF.tar.gz" | tar -xz -C .qwen38-build --strip-components=1
          python3 .qwen38-build/tools/build_site.py --output .qwen38-build/dist
          test -f .qwen38-build/dist/benchmarks/qwen38-4090/index.html
          mkdir -p _site/benchmarks/qwen38-4090
          cp -a .qwen38-build/dist/benchmarks/qwen38-4090/. _site/benchmarks/qwen38-4090/
          mkdir -p _site/assets
          cp -a .qwen38-build/dist/assets/. _site/assets/
          test -f _site/assets/css/qwen38-4090-leaderboard.css
          test -f _site/assets/js/qwen38-4090-leaderboard.js
          test -s _site/assets/benchmarks/qwen38-4090/results.json
          test -s _site/assets/benchmarks/qwen38-4090/samples.json
          # A short URL, without a nav page or a sitemap entry.
          mkdir -p _site/qwen38-4090
          cat > _site/qwen38-4090/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/benchmarks/qwen38-4090/">
          <link rel="canonical" href="https://zedongpeng.com/benchmarks/qwen38-4090/"></head>
          <body><script>location.replace("/benchmarks/qwen38-4090/" + location.search + location.hash);</script>
          <p>The leaderboard is at <a href="/benchmarks/qwen38-4090/">/benchmarks/qwen38-4090/</a>.</p></body></html>
          HTML
      - name: Build the Velodrome site 🚲
        # Same rule as tokendust: the gallery is its own repo, built here so the
        # page and the runs cannot drift. A failed fetch fails the deploy.
        env:
          REPO: zedong-peng/velodrome
          REF: main
        run: |
          mkdir -p .velodrome-build
          curl -fsSL "https://github.com/$REPO/archive/refs/heads/$REF.tar.gz" | tar -xz -C .velodrome-build --strip-components=1
          python3 .velodrome-build/build.py
          mkdir -p _site/velodrome
          cp -a .velodrome-build/site/. _site/velodrome/
          test -f _site/velodrome/index.html
          test -f _site/velodrome/app.js
          test -d _site/velodrome/art
          # Velodrome replaced ZP-Coding (and before it OneShotBench); keep both URLs alive.
          for old in zp-coding oneshot; do
            mkdir -p "_site/$old"
            cat > "_site/$old/index.html" <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/velodrome/">
          <link rel="canonical" href="https://zedongpeng.com/velodrome/"></head>
          <body><script>location.replace("/velodrome/");</script>
          <p>This gallery is now <a href="/velodrome/">Velodrome</a>.</p></body></html>
          HTML
          done
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Print CV to PDF 🖨️
        run: |
          python3 -m http.server 4000 --directory _site >/dev/null 2>&1 &
          server=$!
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=15000 \
            --print-to-pdf=_site/assets/pdf/Zedong_Peng_CV.pdf http://localhost:4000/cv/
          kill $server
          test -s _site/assets/pdf/Zedong_Peng_CV.pdf
      - name: Check internal links 🔗
        # report only: a broken link should not block publishing
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: false
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --no-progress '_site/**/*.html'
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
