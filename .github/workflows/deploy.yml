name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!AGENTS.md"
      - "!CLAUDE.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an older build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick
          JEKYLL_ENV=production bundle exec jekyll build
      - name: Purge unused CSS
        run: npx --yes purgecss -c purgecss.config.js
      - name: Print CV to PDF
        run: |
          python3 -m http.server 4000 --directory _site >/dev/null 2>&1 &
          server=$!
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=15000 \
            --print-to-pdf=_site/assets/pdf/Zedong_Peng_CV.pdf http://localhost:4000/cv/
          kill $server
          test -s _site/assets/pdf/Zedong_Peng_CV.pdf
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
